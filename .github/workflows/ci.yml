name: C++20 build and regression tests

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Configure Ubuntu using the development preset
        if: runner.os == 'Linux'
        run: cmake --preset wsl-release
      - name: Configure other platforms
        if: runner.os != 'Linux'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DQUANTENGINE_BUILD_EXAMPLES=ON
      - name: Build Ubuntu
        if: runner.os == 'Linux'
        run: cmake --build --preset wsl-release --parallel 2
      - name: Build other platforms
        if: runner.os != 'Linux'
        run: cmake --build build --config Release --parallel 2
      - name: Test Ubuntu
        if: runner.os == 'Linux'
        run: ctest --preset wsl-release --output-on-failure
      - name: Test other platforms
        if: runner.os != 'Linux'
        run: ctest --test-dir build -C Release --output-on-failure
